<style>
/* Shell values measured on the live Treasy UAT (Treasy.Pure layout) */

  font-size:11px;font-weight:700;line-height:1;cursor:pointer;user-select:none;vertical-align:middle;flex:0 0 auto;text-transform:none;letter-spacing:0}

<script>
"use strict";
/* ================= PARAMETERS ================= */
const P = {
  currencies: ["TRY","USD","EUR","GBP"],
  // CollateralAnnex / CollateralAnnexRule / CollateralAnnexProduct (Treasy_Collateral_Veri_Modeli.xlsx)
  annexStatus: [{id:"ACTIVE",name:"Active"},{id:"PASSIVE",name:"Passive"}],
  directions: [{id:"BOTH",name:"Both"},{id:"POST_ONLY",name:"Post Only"},{id:"RECEIVE_ONLY",name:"Receive Only"}],
  partyTypes: [{id:"OWN",name:"Own"},{id:"COUNTERPARTY",name:"Counterparty"}],
  roundingMethods: [{id:"NEAREST",name:"Nearest"},{id:"UP",name:"Up"},{id:"DOWN",name:"Down"}],
  marginTypes: [{id:"VM",name:"VM - Variation Margin"},{id:"IM",name:"IM - Initial Margin"},{id:"IA",name:"IA - Independent Amount"},{id:"OTHER",name:"Other"}],
  products: [
    {id:"FX",name:"FX",subs:[{id:"FWD_SWAP_NDF",name:"Forward / Swap / NDF"}]},
    {id:"IR",name:"Interest Rate",subs:[{id:"IRS_CCS",name:"IRS / CCS"}]},
    {id:"MM",name:"Money Market",subs:[{id:"BORROW_LEND",name:"Borrowing / Lending"}]},
    {id:"REPO",name:"Repo",subs:[{id:"REPO_REVREPO",name:"Repo / Reverse Repo"}]},
    {id:"SECLEND",name:"Securities Lending",subs:[{id:"BORROW_LEND",name:"Borrowing / Lending"}]}],
  portfolios: [{id:59032,code:"VB_BNK_COL",name:"COLLATERAL BANKING"},{id:59040,code:"BH_BNK_COL",name:"COLLATERAL BANKING BAHRAIN"}],
  counterparties: [
    {id:87341,code:"TKAS",name:"TAKASBANK"},{id:87348,code:"VBTPP",name:"TAKASBANK PARA PIYASASI"},
    {id:90112,code:"FABA",name:"FIRST ABU DHABI BANK"},{id:90207,code:"BARCCR",name:"BARCLAYS BANK PLC"},
    {id:90215,code:"BNPACS",name:"BNP PARIBAS"},{id:90230,code:"DEUTCS",name:"DEUTSCHE BANK AG"},
    {id:90244,code:"CITICS",name:"CITIBANK NA"},{id:90251,code:"SCBLCS",name:"STANDARD CHARTERED BANK"}],
  // CollateralDefinition (Treasy_Collateral_Veri_Modeli.xlsx). Parameter values: earlier Collateral prototype (Colletral/index.html)
  collateralTypes: [{id:1,code:"CASH",name:"Cash"}],            // Security: not in scope yet
  settlementTypes: [{id:"CAPITALIZE",name:"Capitalize"},{id:"PAYOUT",name:"Pay Out"}],
  rateTypes: [{id:1,code:"FIXED",name:"Fixed"},{id:2,code:"FLOATING",name:"Floating"}],
  floatingRates: [{id:1,code:"ESTR",name:"€STR",currency:"EUR"},{id:2,code:"SOFR",name:"SOFR",currency:"USD"},{id:3,code:"SONIA",name:"SONIA",currency:"GBP"},{id:4,code:"TLREF",name:"TLREF",currency:"TRY"}],
  interestMethods: [{id:1,code:"SIMPLE_LINEAR",name:"Simple Linear"},{id:2,code:"DAILY_COMP",name:"Daily Compounded"}],
  dateBases: [{id:"A360",name:"ACT/360"},{id:"A365",name:"ACT/365"},{id:"3360",name:"30/360"}],
  // mirror of NetTrexCommon.dbo.Currency (only the columns the demo uses). BasisCode -> DateBasis.BasisCode is the
  // default Date Basis of the currency. Demo values follow money market convention; production reads the table.
  currencyRef: [
    {Code:"TRY",Name:"Turkish Lira",BasisCode:"A365",Decimals:2,IsoCode:"949"},
    {Code:"USD",Name:"US Dollar",BasisCode:"A360",Decimals:2,IsoCode:"840"},
    {Code:"EUR",Name:"Euro",BasisCode:"A360",Decimals:2,IsoCode:"978"},
    {Code:"GBP",Name:"Pound Sterling",BasisCode:"A365",Decimals:2,IsoCode:"826"}],
  payFreqs: [{id:1,code:"MONTHLY",name:"Monthly"},{id:2,code:"QUARTERLY",name:"Quarterly"},{id:3,code:"ON_RETURN",name:"On Return"}],
  businessDayRules: [{id:"MODIFIED_FOLLOWING",name:"Modified Following"},{id:"FOLLOWING",name:"Following"},{id:"PRECEDING",name:"Preceding"}],
  // TxnTransaction / TxnTransactionDetail (Treasy_Collateral_Veri_Modeli.xlsx)
  txnTypes: [{id:"INCREASE",name:"Increase"},{id:"DECREASE",name:"Decrease"}],           // Artış (bakiye +) / Azalış (bakiye -)
  amountTypes: [{id:1,code:"Collateral",name:"Collateral"},{id:2,code:"Nema",name:"Nema"}],   // CollateralAmountType
  // payment panel: only the values seen on the live Treasy payment panel; the full lists come from the payment module
  paySettlementTypes: [{id:1,name:"Gross Settlement"},{id:2,name:"Net Settlement"}],
  payInstructionTypes: [{id:1,name:"Bank to Bank"},{id:2,name:"Account to Account"},{id:3,name:"Vostro Account"}],
  // correspondent rows (columns of the Treasy.Pure Payment component drop-down grids). Only bank names are known;
  // account / customer / GL / SWIFT values come from the payment module in production.
  // Demo values: our nostro per currency is representative (TCMB for TRY); the real list comes from the payment module.
  ourCorrespondents: [{Id:1,AccountNumber:"",BankName:"TÜRKİYE CUMHURİYET MERKEZ BANKASI",CustomerId:"",CurrencyCode:"TRY",AccountGLCode:""},
    ...["USD","EUR","GBP"].map((c,i)=>({Id:2+i,AccountNumber:"",BankName:`NOSTRO ${c} (demo)`,CustomerId:"",CurrencyCode:c,AccountGLCode:""}))],
  theirCorrespondents: [{Id:1,SwiftCode:"",BankName:"Test",AccountNumber:"",CurrencyCode:"",CustomerId:null}],   // filled below: counterparty x currency (SSI)
  // same list/order as the live "Records to be listed" filter (subset relevant to definitions + transactions)
  stateFilter: ["Today w/o deleted","Today","Active Records","All Records","Unverified Records","Verified Records","Rejected Records","Deleted Records","Last Seven Days"]
};
const byId = (a,id) => a.find(x => String(x.id) === String(id));
const nameOf = (a,id) => (byId(a,id)||{}).name || "";
const ccyItems = P.currencies.map(c=>({id:c,name:c}));
const cptyText = c => c ? `${c.code} - ${c.name}` : "";
const portfolioText = f => f ? `${f.code} - ${f.name}` : "";

/* ================= HELPERS ================= */
const pad = n => String(n).padStart(2,"0");
const isoToday = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const nowStamp = () => { const d=new Date(); return `${isoToday()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const toDate = s => s ? new Date(String(s).length===10 ? s+"T00:00:00" : String(s).replace(" ","T")) : null;
const toIso = d => d instanceof Date ? `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}` : (d||"");
const fmtNum = n => Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const round2 = n => Math.round(n*100)/100;
const ccyList = s => String(s||"").split(";").map(x=>x.trim()).filter(Boolean);   // CashEligibilityCurrencies is stored ';'-separated
const fmtStamp = s => s ? `${String(s).slice(0,10).split("-").reverse().join(".")} ${String(s).slice(11)}`.trim() : "";
const fmtRate = n =>Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:4});
let CURRENT_USER = "VB37070";
const user = () => CURRENT_USER;
const notify = (message,type="info") => DevExpress.ui.notify({message,type,displayTime:3500,width:"auto",minWidth:320,position:{at:"bottom right",my:"bottom right",offset:"-20 -20"}});
const confirmDlg = msg => DevExpress.ui.dialog.confirm(`<div style="max-width:420px">${msg}</div>`,"Confirmation");

/* ================= FLOW (Treasy state names) ================= */
const PENDING = ["Input","Edit","Delete"];
const isPending = r => PENDING.includes(r.state);
const isDead = r => r.state==="Delete Verified" || r.state==="Input Rejected";
const isLive = r => !isDead(r) && r.state!=="Input"; // approved at least once
function badgeCls(s){ const [a,b]=s.split(" "); const base = a==="Input"?"badge-input":a==="Edit"?"badge-edit":"badge-delete"; return base + (b==="Verified"?" verified":b==="Rejected"?" rejected":""); }
function flowInit(state,maker,date,createdBy,createdDate){ return {state,stateMaker:maker,stateDate:date,createdBy:createdBy||maker,createdDate:createdDate||date,prevStateName:"",prevStateMaker:"",prevStateDate:""}; }
function setState(r,state,maker){ r.prevStateName=r.state; r.prevStateMaker=r.stateMaker; r.prevStateDate=r.stateDate; r.state=state; r.stateMaker=maker; r.stateDate=nowStamp(); }
const HIST = {annex:{},account:{},txn:{}};
function addHist(kind,r,action){ (HIST[kind][r.id]=HIST[kind][r.id]||[]).push({action,stateName:r.state,stateMaker:r.stateMaker,stateDate:toDate(r.stateDate),snapshot:JSON.stringify({...r,...(r.pending||{})})}); }
function stateFilterPass(r,f){
  const d = String(r.stateDate).slice(0,10), today = isoToday();
  const week = new Date(); week.setDate(week.getDate()-7);
  switch(f){
    case "Today w/o deleted": return d===today && r.state!=="Delete Verified";
    case "Today": return d===today;
    case "Active Records": return !isDead(r);
    case "Unverified Records": return isPending(r);
    case "Verified Records": return r.state.endsWith("Verified") && r.state!=="Delete Verified";
    case "Rejected Records": return r.state.endsWith("Rejected");
    case "Deleted Records": return r.state==="Delete Verified";
    case "Last Seven Days": return toDate(r.stateDate) >= week;
    default: return true;
  }
}

/* ================= SEED DATA ================= */
let seq = 1000;
const ISDA = ["ISDA 2002 Master Agreement","2016 Credit Support Annex for Variation Margin"], GMRA = ["GMRA 2011","GMRA 2011"];
let ruleSeq = 0, prodSeq = 0;
const mkRules = (ccy,mta,rnd,parties=["OWN","COUNTERPARTY"]) => parties.map(p=>({id:++ruleSeq,party:p,currency:ccy,threshold:0,mta,rounding:rnd,method:"NEAREST"}));
const mkProds = list => list.map(([product,subProduct,marginType])=>({id:++prodSeq,product,subProduct,marginType,included:true}));
// [code, name, cptyId, [masterAgreement, collateralDocument], baseCcy, direction, validFrom, disputeTolerance, rules, products]
const ANNEX = [
  ["TKASPPSWPCAG","TAKASBANK PARA PIYASASI SWAP",87348,["TAKASBANK PP SWAP","TAKASBANK PP SWAP"],"USD","POST_ONLY","2016-10-31",0,mkRules("USD",0,0,["OWN"]),mkProds([["FX","FWD_SWAP_NDF","VM"]])],
  ["TKASTEMTRY","TAKASBANK TEMINAT HESAPLARI",87341,["TAKASBANK UYELIK VE GARANTI FONU","TAKASBANK UYELIK VE GARANTI FONU"],"TRY","POST_ONLY","2016-10-31",0,mkRules("TRY",0,0,["OWN"]),mkProds([["MM","BORROW_LEND","OTHER"]])],
  ["BKMUYTEMTR","BKM UYELIK TEMINAT",87341,["BKM UYELIK","BKM UYELIK"],"TRY","POST_ONLY","2016-10-31",0,mkRules("TRY",0,0,["OWN"]),mkProds([["MM","BORROW_LEND","OTHER"]])],
  ["BARCCSCAGG","BARCLAYS SWAP CAGG",90207,ISDA,"USD","BOTH","2016-10-31",50000,mkRules("USD",250000,10000),mkProds([["IR","IRS_CCS","VM"],["FX","FWD_SWAP_NDF","VM"]])],
  ["BARCCRCAGG","BARCLAYS REPO CAGG",90207,GMRA,"USD","BOTH","2016-10-31",50000,mkRules("USD",100000,10000),mkProds([["REPO","REPO_REVREPO","VM"]])],
  ["CITICSCAGG","CITIBANK SWAP CAGG",90244,ISDA,"USD","BOTH","2016-10-31",50000,mkRules("USD",250000,10000),mkProds([["IR","IRS_CCS","VM"],["FX","FWD_SWAP_NDF","VM"]])],

/* ================= COLLATERAL TRANSACTION (TxnTransaction + TxnTransactionDetail) =================
   One transaction = one lasting collateral position (definition + portfolio); every movement is a detail row.
   Balance sign: + collateral held by the bank (received), - collateral at the counterparty (posted).
   Increase adds TransactionAmount, Decrease subtracts it. Only verified details count. */
const TXN = [];
let txnSeq = 1000, detSeq = 0;
const txnSign = d => d.transactionType==="INCREASE" ? 1 : -1;
const detCounts = d => d.state==="Input Verified";
const detOrder = (a,b) => (a.valueDate+a.inputDateTime).localeCompare(b.valueDate+b.inputDateTime);
// CurrentBalance = balance after the movement (valuation currency); null for movements that do not count yet
function recalcBalances(list){ let s = 0; list.slice().sort(detOrder).forEach(d=>{ if(detCounts(d)){ s = round2(s+txnSign(d)*d.transactionAmount); d.currentBalance = s; } else d.currentBalance = null; }); return s; }

const NO_PAYMENT = {settlementTypeId:null,paymentInstructionTypeId:null,outgoingCorrespondentId:null,theirBeneficiaryCorrespondentId:null,
  incomingCorrespondentId:null,theirSenderCorrespondentId:null,sendConfirmation:false,sendPayment:false,sendNoticeToReceive:false,instructions:""};
// ---- FX: rate chart of the system parameter FxRateChartId (demo rates against the local currency) ----
const LOCAL_CCY = "TRY";
// demo stand-in for the chart of FxRateChartId; production reads that chart for the trade date
const FX_RATES = {   // [valid from, rate against TRY]: the rate of a date is the latest row on or before it
  USD:[["2024-01-01",30.10],["2024-07-01",32.80],["2025-01-01",35.40],["2025-07-01",39.90],["2026-01-01",42.50],["2026-10-01",44.00]],
  EUR:[["2024-01-01",33.20],["2024-07-01",35.40],["2025-01-01",37.00],["2025-07-01",46.70],["2026-01-01",49.90],["2026-10-01",47.74]],
  GBP:[["2024-01-01",38.30],["2024-07-01",41.50],["2025-01-01",44.30],["2025-07-01",54.00],["2026-01-01",57.30],["2026-10-01",55.80]]};
function chartRate(ccy,date){
  if(!ccy || ccy===LOCAL_CCY) return 1;
  const rows = FX_RATES[ccy]||[], d = date ? (date instanceof Date ? toIso(date) : String(date).slice(0,10)) : isoToday();
  const hit = rows.filter(r=>r[0]<=d).pop() || rows[0]; return hit ? hit[1] : null;
}
// FX Rate = currency -> valuation currency rate of the trade date (cross over the local currency); empty when both are the same
function defaultFx(ccy,valCcy,date){
  if(!ccy || !valCcy || ccy===valCcy) return null;
  const c = chartRate(ccy,date), v = chartRate(valCcy,date);
  return c && v ? Math.round(c/v*1e6)/1e6 : null;
}
// Transaction Amount (valuation currency) = Amount × FX Rate; Amount itself when the currencies are the same
function txnAmount(amount,ccy,valCcy,fxRate){
  if(amount==null || amount==="") return null;
  if(ccy===valCcy) return round2(Number(amount));
  return Number(fxRate) > 0 ? round2(Number(amount)*Number(fxRate)) : null;
}
// SSI of the demo: one their-side correspondent per counterparty + currency
P.counterparties.forEach(cp=>P.currencyRef.forEach(c=>P.theirCorrespondents.push({Id:P.theirCorrespondents.length+1,SwiftCode:"",BankName:`${cp.name} ${c.Code} (demo)`,AccountNumber:"",CurrencyCode:c.Code,CustomerId:cp.id})));
// payment values of a movement from the counterparty + currency (standing settlement instructions); empty until both are known
function paySsi(cptyId,ccy){
  if(!cptyId||!ccy) return {...NO_PAYMENT};
  const ours = P.ourCorrespondents.find(x=>x.CurrencyCode===ccy), theirs = P.theirCorrespondents.find(x=>x.CustomerId===cptyId&&x.CurrencyCode===ccy);
  return {...NO_PAYMENT,settlementTypeId:2,paymentInstructionTypeId:1,outgoingCorrespondentId:ours?ours.Id:null,incomingCorrespondentId:ours?ours.Id:null,
    theirBeneficiaryCorrespondentId:theirs?theirs.Id:null,theirSenderCorrespondentId:theirs?theirs.Id:null,sendConfirmation:true};
}

/* ================= APPROVAL ================= */
function decide(r,approve){
  if(!r) return;
  if(r.stateMaker===user()){ notify("You cannot verify or reject a transaction you entered.","error"); return; }
  const kind = ACTIVE.kind;
  const was = r.state;
  // transaction: the movements waiting in the pool share the decision of their transaction
  const newDet = kind==="txn" && was==="Edit" && r.pending ? r.pending.details.filter(d=>d.state==="Input") : [];
  if(was==="Input"){ setState(r,approve?"Input Verified":"Input Rejected",user()); }
  if(was==="Edit"){ if(approve) Object.assign(r,r.pending); r.pending=null; setState(r,approve?"Edit Verified":"Edit Rejected",user()); }
  if(was==="Delete"){ setState(r,approve?"Delete Verified":"Delete Rejected",user()); }
  if(kind==="txn" && was!=="Delete"){ const fin = d => setState(d,approve?"Input Verified":"Input Rejected",user());
    if(was==="Input" || approve) r.details.filter(d=>d.state==="Input").forEach(fin);
    else newDet.forEach(d=>{ fin(d); r.details.push(d); });   // rejected movement stays in the history, without effect on the balance
    recalcBalances(r.details); }
  addHist(kind,r,approve?"Verify":"Reject");
  notify(`${ACTIVE.label(r)} ${approve?"has been verified.":"has been rejected."}`,approve?"success":"warning");
  refresh(); return true;
}
function deleteRecord(r){
  if(!r) return;
  const kind = ACTIVE.kind;
  if(kind==="annex" && ACCOUNT.some(a=>a.annexId===r.id&&!isDead(a))){ notify("This agreement is used by a collateral definition and cannot be deleted.","error"); return; }
  if(kind==="account" && TXN.some(t=>t.definitionId===r.id&&!isDead(t))){ notify("This collateral definition has active transactions and cannot be deleted. Set it passive instead.","error"); return; }
  const msg = kind==="txn" ? `Transaction ${r.logicalReference} and its movements will be deleted and sent to the validation pool. Do you want to continue?` : "The record will be deleted and sent to the validation pool. Do you want to continue?";
  return confirmDlg(msg).then(ok=>{ if(!ok) return; setState(r,"Delete",user()); addHist(kind,r,"Delete"); notify(`${ACTIVE.label(r)} The transaction fell into the validation pool.`,"success"); POPUP.hide(); refresh(); });
}

function devShow($panel,doc,key,$q){

// doc keys: form dataField, "__table" (popup title) and section captions (doc[key].section = caption text)
function devAttach(form,doc,$panel){
  const $root = form.$element();
  Object.keys(doc).forEach(key=>{
    const x = doc[key]; let $host = null;
    if(x.section) $host = $root.find(".dx-form-group-caption").filter((i,el)=>$(el).text().trim().startsWith(x.section)).first();   // caption may carry a suffix, e.g. "(last movement)"
    else { const ed = form.getEditor(key); if(ed) $host = ed.$element().closest(".dx-field-item").find(".dx-field-item-label-content").first(); }
    if(!$host || !$host.length) return;
    $host.find(".dev-q").remove();
    const $q = devQ(key).appendTo($host);
    $q.on("click keydown",e=>{ if(e.type==="keydown"&&e.key!=="Enter") return; e.preventDefault(); e.stopPropagation(); devShow($panel,doc,key,$q); });
  });
}

/* Payment panel as an accordion (Treasy.Pure Payment component, EnabledAccordion = true): the group caption is the header */
function payAccordion(form){
  const $g = form.$element().find(".pay-accordion").first(); if(!$g.length) return;
  const $cap = $g.find("> .dx-field-item-content > .dx-form-group > .dx-form-group-caption").first();
  if(!$cap.find(".pay-acc-chev").length) $('<i class="fa-solid fa-chevron-up pay-acc-chev"></i>').appendTo($cap);
  $cap.attr({role:"button",tabindex:0,"aria-expanded":"true"}).off(".acc").on("click.acc keydown.acc",e=>{
    if(e.type==="keydown"&&e.key!=="Enter"&&e.key!==" ") return;
    if($(e.target).closest(".dev-q").length) return;   // the developer-mode "?" keeps its own click
    e.preventDefault(); payToggle($g); });
}
function payToggle($g,open){
  const $body = $g.find("> .dx-field-item-content > .dx-form-group > .dx-form-group-content").first(), isOpen = !$g.hasClass("acc-closed");
  if(open===undefined) open = !isOpen; if(open===isOpen) return;
  $g.toggleClass("acc-closed",!open);
  $g.find("> .dx-field-item-content > .dx-form-group > .dx-form-group-caption").attr("aria-expanded",String(open)).find(".pay-acc-chev").toggleClass("fa-chevron-up",open).toggleClass("fa-chevron-down",!open);
  open ? $body.stop(true,true).slideDown(300) : $body.stop(true,true).slideUp(300);
}
// a save blocked by a payment field must not stay hidden behind a closed panel
function openPayIfInvalid(v){
  const $g = FORM.$element().find(".pay-accordion").first();
  if($g.hasClass("acc-closed") && v.brokenRules.some(r=>r.validator && $.contains($g[0],r.validator.$element()[0]))){ payToggle($g,true); notify("Payment Instructions has missing fields.","warning"); }
}

    const AG_FIELDS = ["direction","valuationCurrency","validFrom"];
    const fromAg = ag => ({cptyId:ag.cptyId,direction:ag.direction,valuationCurrency:ag.baseCurrency,validFrom:toDate(ag.validFrom)});

    const fd = () => FORM.option("formData");
    const agOf = () => byId(ANNEX,fd().agreementId);
    const filled = v => v!==null && v!==undefined && v!=="" && !(Array.isArray(v)&&!v.length);
    // required only while the condition holds; the red * is driven by CSS classes set in applyState()
    const reqIf = (cond,message="Required") => ({type:"custom",reevaluate:true,message,validationCallback:e=>!cond()||filled(e.value)});
    const intOn = () => !!fd().isInterestCalculated, isFixed = () => intOn()&&fd().rateTypeId===1, isFloat = () => intOn()&&fd().rateTypeId===2;
    const pct = (extra={}) => ({format:"#,##0.0000",placeholder:"0.0000",valueChangeEvent:"keyup input change",
      buttons:[{name:"pct",location:"after",options:{text:"%",stylingMode:"text",focusStateEnabled:false,hoverStateEnabled:false,activeStateEnabled:false,elementAttr:{class:"ccy-suffix"}}}],...extra});
    const INT_FIELDS = ["settlementType","rateTypeId","interestMethodId","dateBasis","payFreqId","businessDayRule","isNegativeRateAllowed"];
    const applyState = form => {
      const f = form.option("formData"), on = !!f.isInterestCalculated, fixed = on&&f.rateTypeId===1, flo = on&&f.rateTypeId===2;
      form.$element().toggleClass("st-int",on).toggleClass("st-fixed",fixed).toggleClass("st-float",flo);
      // Floating shows the index, anything else shows the fixed rate (same cell)
      const showFloat = f.rateTypeId===2;
      if(form.itemOption("interest.floatingRateTypeId").visible!==showFloat){
        form.beginUpdate(); form.itemOption("interest.fixedRate","visible",!showFloat); form.itemOption("interest.floatingRateTypeId","visible",showFloat); form.endUpdate();
        // the group is re-rendered: restore "?" icons and editor state once the new editors exist
        setTimeout(()=>{ form._devDoc && devAttach(form,form._devDoc,form._devPanel); applyState(form); },0);
        return; }
      const fixEd = form.getEditor("fixedRate"), floEd = form.getEditor("floatingRateTypeId");   // the hidden one has no editor
      floEd && floEd.option("items",P.floatingRates.filter(x=>!f.valuationCurrency||x.currency===f.valuationCurrency));
      form.getEditor("cptyId").option("readOnly",view||used||!!f.agreementId);
      AG_FIELDS.forEach(k=>form.getEditor(k).option("readOnly",view||!!f.agreementId));
      if(view) return;
      INT_FIELDS.forEach(k=>form.getEditor(k).option("disabled",!on));
      fixEd && fixEd.option("disabled",!fixed);
      floEd && floEd.option("disabled",!flo);
      form.getEditor("spread").option("disabled",!on);   // spread does not depend on Rate Type
    };
    let busy = false;   // updateData inside onFieldDataChanged must not re-enter the dependency rules
    let lastCcy = d.valuationCurrency;
    // Date Basis defaults to Currency.BasisCode of the Valuation Currency, unless the user picked another basis by hand
    const basisOf = ccy => (P.currencyRef.find(c=>c.Code===ccy)||{}).BasisCode;
    const defaultBasis = (form,ccy) => { const f = form.option("formData"), def = basisOf(ccy);
      if(f.isInterestCalculated && def && (!f.dateBasis || f.dateBasis===basisOf(lastCcy))) form.updateData("dateBasis",def); };
    const onChange = e => {
      if(busy) return; busy = true; const form = e.component, f = form.option("formData");
      try{
        if(e.dataField==="agreementId"){ const ag = byId(ANNEX,e.value);

          if(ag) form.updateData({...fromAg(ag),validTo:toDate(ag.validTo),currencies:f.currencies&&f.currencies.length?f.currencies:[ag.baseCurrency]}); }
        if(e.dataField==="isInterestCalculated"){ if(!e.value){ const {isInterestCalculated,...rest} = NO_INTEREST; form.updateData(rest); } else defaultBasis(form,f.valuationCurrency); }
        // Fixed -> Simple Linear, Floating -> Daily Compounded (user can still change it)
        if(e.dataField==="rateTypeId"){ if(e.value===1) form.updateData({floatingRateTypeId:null,interestMethodId:1}); if(e.value===2) form.updateData({fixedRate:null,interestMethodId:2}); }
        const ccy = form.option("formData").valuationCurrency;   // may have been set by the agreement above
        if(ccy!==lastCcy){ const fl = byId(P.floatingRates,f.floatingRateTypeId); if(fl&&fl.currency!==ccy) form.updateData("floatingRateTypeId",null);
          defaultBasis(form,ccy); lastCcy = ccy; }
      } finally { busy = false; }
      if(["agreementId","isInterestCalculated","rateTypeId","valuationCurrency"].includes(e.dataField)) applyState(form);
    };
    const S = (dataField,text,editorType,editorOptions,extra={}) => ({dataField,label:{text},editorType,editorOptions,...extra});
    return { width:1040, devDoc:DEVDOC_DEF,

        {itemType:"group",caption:"General Information",colCount:2,cssClass:"annex-section",items:[

          S("agreementId","Collateral Annex","dxSelectBox",sb(agreements,{displayExpr:a=>a?`${a.code} - ${a.name}`:"",searchEnabled:true,showClearButton:true,readOnly:used||view})),

          S("collateralTypeId","Collateral Type","dxSelectBox",sb(P.collateralTypes,{readOnly:used||view}),{validationRules:reqRule}),
          S("status","Status","dxSelectBox",sb(P.annexStatus),{validationRules:reqRule}),
          S("currencies","Eligible Currencies","dxTagBox",{items:P.currencies,showSelectionControls:true,applyValueMode:"instantly",placeholder:"Select...",multiline:false},
            {validationRules:[{type:"custom",message:"At least one eligible currency is required.",validationCallback:e=>filled(e.value)}],isRequired:true})
        ]},
        {itemType:"group",caption:"Cash Eligibility",colCount:2,cssClass:"annex-section",items:[
          S("direction","Eligibility Direction","dxSelectBox",sb(P.directions),{validationRules:[...reqRule,{type:"custom",reevaluate:true,
            message:"Eligibility Direction must match the Collateral Annex direction.",validationCallback:e=>{ const ag=agOf(); return !ag||ag.direction==="BOTH"||e.value===ag.direction; }}]}),
          S("valuationCurrency","Valuation Currency","dxSelectBox",{items:P.currencies,placeholder:"Select..."},{validationRules:reqRule}),
          S("validFrom","Valid From","dxDateBox",{displayFormat:"dd/MM/yyyy"},{validationRules:reqRule}),
          S("validTo","Valid To","dxDateBox",{displayFormat:"dd/MM/yyyy",showClearButton:true},{validationRules:[{type:"custom",reevaluate:true,message:"Valid To cannot be earlier than Valid From.",
            validationCallback:e=>!e.value||!fd().validFrom||toIso(e.value)>=toIso(fd().validFrom)}]})
        ]},
        {itemType:"group",name:"interest",caption:"Cash Interest Terms",colCount:2,cssClass:"annex-section int-terms",items:[
          S("isInterestCalculated","Interest Calculated","dxSwitch",{switchedOnText:"Yes",switchedOffText:"No"}),
          S("settlementType","Interest Settlement","dxSelectBox",sb(P.settlementTypes),{cssClass:"req-int",validationRules:[reqIf(intOn)]}),
          S("rateTypeId","Rate Type","dxSelectBox",sb(P.rateTypes),{cssClass:"req-int",validationRules:[reqIf(intOn)]}),
          // Fixed Rate and Floating Rate Index share one cell: DevExtreme drops the hidden one from the layout
          S("fixedRate","Fixed Rate","dxNumberBox",pct(),{visible:d.rateTypeId!==2,cssClass:"req-fixed",validationRules:[reqIf(isFixed),{type:"custom",reevaluate:true,message:"Negative rate is not allowed for this definition.",
            validationCallback:e=>!isFixed()||fd().isNegativeRateAllowed||!(Number(e.value)<0)}]}),
          S("floatingRateTypeId","Floating Rate Index","dxSelectBox",sb(P.floatingRates,{displayExpr:x=>x?`${x.name} (${x.currency})`:"",noDataText:"No index for the valuation currency"}),
            {visible:d.rateTypeId===2,cssClass:"req-float",validationRules:[reqIf(isFloat)]}),
          S("spread","Spread","dxNumberBox",pct()),
          S("interestMethodId","Interest Method","dxSelectBox",sb(P.interestMethods),{cssClass:"req-int",validationRules:[reqIf(intOn)]}),
          S("dateBasis","Date Basis","dxSelectBox",sb(P.dateBases),{cssClass:"req-int",validationRules:[reqIf(intOn)]}),
          S("payFreqId","Payment Frequency","dxSelectBox",sb(P.payFreqs),{cssClass:"req-int",validationRules:[reqIf(intOn)]}),
          S("businessDayRule","Business Day Rule","dxSelectBox",sb(P.businessDayRules),{cssClass:"req-int",validationRules:[reqIf(intOn)]}),
          S("isNegativeRateAllowed","Negative Rate Allowed","dxSwitch",{switchedOnText:"Yes",switchedOffText:"No"})
        ]}
      ]},
      ready:applyState,
      save:()=>{ if(!FORM.validate().isValid) return; const f=fd(), on=!!f.isInterestCalculated;
        const v = {code:f.code.trim().toUpperCase(),name:f.name.trim(),agreementId:f.agreementId||null,cptyId:f.cptyId,collateralTypeId:f.collateralTypeId,status:f.status,
          direction:f.direction,currencies:f.currencies.join(";"),valuationCurrency:f.valuationCurrency,validFrom:toIso(f.validFrom),validTo:toIso(f.validTo),

  txn(mode,r){
    const view = mode==="view", isNew = mode==="new";
    const d = r ? {...r,...(r.pending||{})} : null;
    const details = d ? d.details.map(x=>({...x})) : [];
    const usable = ACCOUNT.filter(a=>(a.status==="ACTIVE"&&isLive(a))||(r&&a.id===r.definitionId));
    const lastDet = details.slice().sort(detOrder).pop();
    // view: show the latest movement; new / edit: an empty movement to be added to the transaction
    const mv = view && lastDet ? {...lastDet} : {transactionType:null,amountType:1,marginTypeId:"VM",tradeDate:isoToday(),valueDate:isoToday(),cashCurrency:null,
      amount:null,fxRate:null,isSettlementRequired:false,...NO_PAYMENT};
    const data = {definitionId:d?d.definitionId:null,cptyId:d?d.cptyId:null,agreementId:d?d.agreementId:null,portfolioId:d?d.portfolioId:null,
      logicalReference:r?r.logicalReference:"(assigned on save)",businessKey:r?String(r.businessKey):"(assigned on save)",
      trader:r?r.trader:user(),inputDateTime:r?fmtStamp(r.inputDateTime):"(system)",
      ...mv,tradeDate:toDate(mv.tradeDate),valueDate:toDate(mv.valueDate),valuationCurrency:"",transactionAmount:null,currentBalance:null};
    // adding a movement to an existing transaction: the definition is already known, default Cash Currency = Valuation Currency
    if(!view && d && !data.cashCurrency){ const def0 = byId(ACCOUNT,d.definitionId); data.cashCurrency = def0 ? def0.valuationCurrency : null; }
    if(!view && d && data.fxRate==null){ const def0 = byId(ACCOUNT,d.definitionId); data.fxRate = defaultFx(data.cashCurrency,def0&&def0.valuationCurrency,data.tradeDate); }
    if(!view && d) Object.assign(data,paySsi(d.cptyId,data.cashCurrency));
    const fd = () => FORM.option("formData");
    const defOf = () => byId(ACCOUNT,fd().definitionId);
    const filled = v => v!==null && v!==undefined && v!=="";
    const payOn = () => !!fd().isSettlementRequired;
    const sameAsVal = () => { const def = defOf(); return !!(def && fd().cashCurrency===def.valuationCurrency); };
    const reqIf = (cond,message="Required") => ({type:"custom",reevaluate:true,message,validationCallback:e=>!cond()||filled(e.value)});
    const sfx = text => [{name:"sfx",location:"after",options:{text,stylingMode:"text",focusStateEnabled:false,hoverStateEnabled:false,activeStateEnabled:false,elementAttr:{class:"ccy-suffix"}}}];
    const setSfx = (form,field,text) => { const b = form.getEditor(field) && form.getEditor(field).getButton("sfx"); b && b.option("text",text||""); };
    const balanceBefore = () => round2(details.filter(detCounts).reduce((s,x)=>s+txnSign(x)*x.transactionAmount,0));
    let valueTouched = false, detGrid = null, $limit = null;
    const PAY_FIELDS = ["settlementTypeId","paymentInstructionTypeId","outgoingCorrespondentId","theirBeneficiaryCorrespondentId","incomingCorrespondentId","theirSenderCorrespondentId","sendConfirmation","sendPayment","sendNoticeToReceive","instructions"];

    // derived values: counterparty / agreement / valuation currency from the definition, amounts, projected balance, limit box
    const refreshDerived = form => {
      const f = form.option("formData"), def = defOf(), vc = def ? def.valuationCurrency : "";
      const sameCcy = !!(def && f.cashCurrency && f.cashCurrency===vc);
      if(!view && sameCcy && f.fxRate!=null) form.updateData("fxRate",null);
      const ta = def && f.cashCurrency ? txnAmount(f.amount,f.cashCurrency,vc,f.fxRate) : null;
      const after = view ? f.currentBalance : (ta!=null&&f.transactionType ? round2(balanceBefore()+(f.transactionType==="INCREASE"?1:-1)*ta) : null);
      form.updateData({cptyId:def?def.cptyId:null,agreementId:def?(def.agreementId||null):null,valuationCurrency:vc,transactionAmount:ta,currentBalance:after});
      setSfx(form,"amount",f.cashCurrency); setSfx(form,"transactionAmount",vc); setSfx(form,"currentBalance",vc);
      form.getEditor("cashCurrency").option("items",def?ccyList(def.currencies):[]);

        ["transactionType","amountType","marginTypeId","isSettlementRequired","tradeDate","valueDate","cashCurrency","amount","fxRate"].forEach(k=>form.getEditor(k).option("disabled",!def));

      form.$element().toggleClass("st-pay",!!f.isSettlementRequired).toggleClass("st-fx",!sameCcy);

    // ---- limit status box (layout of the Treasy limit component; limit figures: data source is an open decision) ----

          <div class="lb-usage"><div class="lu-top"><span><span class="lu-pct">%0</span> used</span><i class="fa-solid fa-circle-info lu-info" title="Limit data source: open decision (KGR)"></i></div>
            <div class="lu-bar"><div class="lu-fill"></div></div><div class="lu-legend"><span class="c-used">● % 0 used</span><span class="c-avail">● % 0 available</span></div></div>
        </div></div>`).appendTo(el);
      $limit.on("click",".lh-btn",e=>{ const a = $(e.currentTarget).data("a");
        if(a==="toggle"){ $limit.toggleClass("collapsed"); $(e.currentTarget).find("i").toggleClass("fa-chevron-up fa-chevron-down"); }
        if(a==="more") notify("Limit actions are not part of the demo.","warning");
        if(a==="refresh"){ if(!defOf()){ notify("Please select a collateral definition first.","warning"); return; }
          $limit.find(".lh-pill").addClass("warn").find(".pill-text").text("Limit service not connected");
          notify("Limit data source (KGR) is an open decision: no limit figures in the demo.","warning"); } });
    };
    // ---- Transaction Detail tab: all movements of the transaction ----
    const detailTemplate = (_,el) => {
      const $w = $('<div class="txn-det">').appendTo(el);
      const bal = d ? txnBalance(d) : 0, def = d ? byId(ACCOUNT,d.definitionId) : null;
      $(`<div class="txn-det-sum">${d?`Current balance: <b class="${bal<0?"cell-neg":bal>0?"cell-pos":""}">${fmtNum(bal)} ${def?def.valuationCurrency:""}</b> · ${details.filter(detCounts).length} verified movement(s)`:"No movement yet: the first movement is entered on the Transaction tab."}</div>`).appendTo($w);
      detGrid = $("<div>").appendTo($w).dxDataGrid({dataSource:details.slice().sort(detOrder).reverse().map(x=>({...x,tradeDate:toDate(x.tradeDate),valueDate:toDate(x.valueDate),stateDate:toDate(x.stateDate),prevStateDate:toDate(x.prevStateDate),createdDate:toDate(x.createdDate)})),
        keyExpr:"id",showBorders:true,showRowLines:true,rowAlternationEnabled:true,columnAutoWidth:false,allowColumnResizing:true,height:420,scrolling:{useNative:false,showScrollbar:"always"},
        noDataText:"No movement",onRowDblClick:e=>previewMovement(e.key),
        columns:[
          {type:"buttons",width:50,buttons:[{icon:"fa-solid fa-eye",hint:"Preview",onClick:e=>previewMovement(e.row.key)}]},

          {dataField:"amountType",caption:"Amount Type",width:105,calculateDisplayValue:x=>nameOf(P.amountTypes,x.amountType)},
          {dataField:"marginTypeId",caption:"Margin Type",width:100,calculateDisplayValue:x=>x.marginTypeId==="OTHER"?"Other":x.marginTypeId},
          {dataField:"tradeDate",caption:"Trade Date",dataType:"date",format:"dd.MM.yyyy",width:100},{dataField:"valueDate",caption:"Value Date",dataType:"date",format:"dd.MM.yyyy",width:100},

    };
    const S = (dataField,text,editorType,editorOptions,extra={}) => ({dataField,label:{text},editorType,editorOptions,...extra});

      if(e.dataField==="amountType" && (e.value===2) && f.marginTypeId==="VM") form.updateData("marginTypeId","OTHER");

      S("portfolioId","Portfolio","dxSelectBox",sb(P.portfolios,{displayExpr:portfolioText,readOnly:!isNew}),{validationRules:[...reqRule,{type:"custom",reevaluate:true,

    const detail = {itemType:"group",caption:view?"Detail Information (last movement)":"Detail Information",colCount:2,cssClass:"annex-section",items:[
      S("transactionType","Transaction Type","dxSelectBox",sb(P.txnTypes),{validationRules:reqRule}),
      S("amountType","Amount Type","dxSelectBox",sb(P.amountTypes),{validationRules:reqRule}),
      S("marginTypeId","Margin Type","dxSelectBox",sb(P.marginTypes),{validationRules:reqRule}),
      S("isSettlementRequired","Settlement Required","dxSwitch",{switchedOnText:"Yes",switchedOffText:"No"}),
      S("tradeDate","Trade Date","dxDateBox",{displayFormat:"dd/MM/yyyy"},{validationRules:reqRule}),
      S("valueDate","Value Date","dxDateBox",{displayFormat:"dd/MM/yyyy"},{validationRules:[...reqRule,{type:"custom",reevaluate:true,message:"Value Date cannot be earlier than Trade Date.",
        validationCallback:e=>!e.value||!fd().tradeDate||toIso(e.value)>=toIso(fd().tradeDate)}]}),
      S("cashCurrency","Currency","dxSelectBox",{items:[],placeholder:"Select...",noDataText:"Select a collateral definition first"},{validationRules:reqRule}),
      S("amount","Amount","dxNumberBox",{format:"#,##0.00",placeholder:"0.00",valueChangeEvent:"keyup input change",buttons:sfx(mv.cashCurrency||"")},
        {validationRules:[...reqRule,{type:"custom",message:"Amount must be greater than zero.",validationCallback:e=>Number(e.value)>0}]}),
      S("fxRate","FX Rate","dxNumberBox",{format:"#,##0.000000",placeholder:"0.000000",valueChangeEvent:"keyup input change"},
        {cssClass:"req-fx",validationRules:[reqIf(()=>!sameAsVal()),{type:"custom",reevaluate:true,message:"FX Rate must be greater than zero.",
          validationCallback:e=>sameAsVal()||!filled(e.value)||Number(e.value)>0}]}),
      S("transactionAmount","Transaction Amount","dxNumberBox",{format:"#,##0.00",readOnly:true,elementAttr:{class:"field-locked"},buttons:sfx("")}),
      roTxt("valuationCurrency","Valuation Currency"),
      S("currentBalance","Current Balance","dxNumberBox",{format:"#,##0.00",readOnly:true,elementAttr:{class:"field-locked"},buttons:sfx("")})]};
    const limitItem = {itemType:"simpleItem",label:{visible:false},cssClass:"limit-item",template:limitTemplate};
    // correspondent drop-down box with a grid, like ddbWeSend / ddbTheirReceive of the Payment component
    const corrBox = (rows,ours) => ({dataSource:rows,valueExpr:"Id",displayExpr:"BankName",showClearButton:true,placeholder:"Select...",dropDownOptions:{width:450},
      contentTemplate:ev=>{ const $g=$("<div>"); $g.dxDataGrid({dataSource:rows,keyExpr:"Id",hoverStateEnabled:true,showBorders:true,height:220,filterRow:{visible:true},selection:{mode:"single"},
        selectedRowKeys:ev.component.option("value")!=null?[ev.component.option("value")]:[],
        columns:(ours?[["AccountNumber","Account Number"],["BankName","Bank Name"],["CustomerId","Customer Id"],["CurrencyCode","Currency Code"],["AccountGLCode","Account GL Code"]]
                     :[["SwiftCode","Swift Code"],["BankName","Bank Name"],["AccountNumber","Account Number"],["CurrencyCode","Currency Code"]]).map(([dataField,caption])=>({dataField,caption})),
        onSelectionChanged:x=>{ const k=x.selectedRowKeys[0]; if(k!==undefined){ ev.component.option("value",k); ev.component.close(); } }}); return $g; }});
    const arrow = (cls,icon) => ({itemType:"simpleItem",colSpan:1,label:{visible:false},template:()=>$(`<div class="arrow-icon ${cls}"><i class="fa-solid ${icon}"></i></div>`)});

    // payment panel layout; preview = read-only copy for the movement preview (no accordion, no validation)
    const payGroup = (preview=false) => { const pay = {colSpan:6,cssClass:"req-pay",validationRules:preview?[]:[reqIf(payOn)]};
      return {itemType:"group",caption:"Payment Instructions",colCount:2,cssClass:"annex-section pay-section"+(preview?"":" pay-accordion"),items:[
      row([S("settlementTypeId","Settlement Type","dxSelectBox",sb(P.paySettlementTypes,{showClearButton:true}),pay),
        {itemType:"empty",colSpan:1},
        S("paymentInstructionTypeId","Payment Instr. Type","dxSelectBox",sb(P.payInstructionTypes,{showClearButton:true}),pay)]),
      row([S("outgoingCorrespondentId","We Send","dxDropDownBox",corrBox(P.ourCorrespondents,true),pay),
        arrow("arrow-icon-red","fa-right-long"),
        S("theirBeneficiaryCorrespondentId","They Receive","dxDropDownBox",corrBox(P.theirCorrespondents,false),pay)],"payment-outgoing-group"),
      row([S("incomingCorrespondentId","We Receive","dxDropDownBox",corrBox(P.ourCorrespondents,true),pay),
        arrow("arrow-icon-green","fa-left-long"),
        S("theirSenderCorrespondentId","They Send","dxDropDownBox",corrBox(P.theirCorrespondents,false),pay)],"payment-incoming-group"),
      {itemType:"group",colSpan:2,colCount:3,cssClass:"arrow-group",items:[
        S("sendConfirmation","Send Confirmation","dxCheckBox",{}),S("sendPayment","Send Payment","dxCheckBox",{}),S("sendNoticeToReceive","Send Notice To Receive","dxCheckBox",{})]},
      {itemType:"group",colSpan:2,items:[S("instructions","Instructions","dxTextArea",{maxLength:400,height:50})]}]}; };
    const payment = payGroup();
    // ---- movement preview (Transaction Detail tab): the movement and its payment instructions, read-only ----
    const previewMovement = id => { const x = details.find(m=>m.id===id); if(!x) return;
      const num = (dataField,text,fmt,ccy) => S(dataField,text,"dxNumberBox",{format:fmt,buttons:sfx(ccy||"")});
      subForm({titleText:`Movement Preview<span class="popup-title-span">[ ${nameOf(P.txnTypes,x.transactionType)} · ${fmtNum(x.amount)} ${x.cashCurrency} ]</span>`,
        width:1100,readOnly:true,devDoc:DEVDOC_TXN,
        data:{...x,tradeDate:toDate(x.tradeDate),valueDate:toDate(x.valueDate)},
        items:[
          {itemType:"group",caption:"Detail Information",colCount:2,cssClass:"annex-section",items:[
            S("transactionType","Transaction Type","dxSelectBox",sb(P.txnTypes)),S("amountType","Amount Type","dxSelectBox",sb(P.amountTypes)),
            S("marginTypeId","Margin Type","dxSelectBox",sb(P.marginTypes)),S("isSettlementRequired","Settlement Required","dxSwitch",{switchedOnText:"Yes",switchedOffText:"No"}),
            S("tradeDate","Trade Date","dxDateBox",{displayFormat:"dd/MM/yyyy"}),S("valueDate","Value Date","dxDateBox",{displayFormat:"dd/MM/yyyy"}),
            S("cashCurrency","Currency"),num("amount","Amount","#,##0.00",x.cashCurrency),

          payGroup(true)]});

    return { width:1180, devDoc:DEVDOC_TXN,
      form:{formData:data,labelLocation:"left",readOnly:view,colCount:1,showColonAfterLabel:false,onFieldDataChanged:onChange,items:[
        {itemType:"tabbed",tabPanelOptions:{deferRendering:false,animationEnabled:true,onSelectionChanged:()=>setTimeout(()=>detGrid&&detGrid.updateDimensions(),50)},tabs:[
          {title:"Transaction",items:[general,detail,limitItem,payment]},
          {title:"Transaction Detail",badge:String(details.length||""),items:[{itemType:"simpleItem",label:{visible:false},template:detailTemplate}]}]}]},
      ready:form=>{ refreshDerived(form); payAccordion(form);
        form.getEditor("valueDate").on("valueChanged",ev=>{ if(ev.event) valueTouched = true; }); },
      save:()=>{ const v = FORM.validate(); if(!v.isValid){ openPayIfInvalid(v); return; } const f = fd(), def = defOf(), on = !!f.isSettlementRequired;
        const pay = Object.fromEntries(PAY_FIELDS.map(k=>[k,k==="instructions"?(f[k]||"").trim():(typeof NO_PAYMENT[k]==="boolean"?!!f[k]:f[k])]));   // kept also when Settlement Required is off
        const det = {id:++detSeq,transactionType:f.transactionType,amountType:f.amountType,marginTypeId:f.marginTypeId,tradeDate:toIso(f.tradeDate),valueDate:toIso(f.valueDate),
          cashCurrency:f.cashCurrency,amount:Number(f.amount),fxRate:f.cashCurrency===def.valuationCurrency?null:Number(f.fxRate),
          transactionAmount:txnAmount(f.amount,f.cashCurrency,def.valuationCurrency,f.fxRate),valuationCurrency:def.valuationCurrency,
          currentBalance:null,isSettlementRequired:on,...pay,inputDateTime:nowStamp(),trader:user(),...flowInit("Input",user(),nowStamp())};
        if(isNew){ saveCommon("txn","new",null,{definitionId:def.id,cptyId:def.cptyId,agreementId:def.agreementId||null,portfolioId:f.portfolioId,
            logicalReference:"CTX"+String(++txnSeq).padStart(10,"0"),businessKey:txnSeq,inputDateTime:nowStamp(),trader:user(),details:[det],pending:null},TXN,x=>x.logicalReference); return; }
        saveCommon("txn","edit",r,{details:[...details,det]},TXN,x=>x.logicalReference); }
    };
  }
};

let TREE, DRAWER;
function setTheme(theme){
  document.documentElement.setAttribute("data-theme",theme);

  document.getElementById("themeLight").disabled = theme!=="light";
  $("#logo-img").attr("src",theme==="dark"?"assets/logo/logo-treasy-white.png":"assets/logo/logo-treasy-dark.png");
  $("#treasy-logo").attr("src",theme==="dark"?"assets/logo/logo-treasy-white.png":"assets/logo/logo-treasy-dark.png");
  try{ localStorage.setItem("ai-theme",theme==="dark"?"material.blue.dark.compact":"material.blue.light.compact"); }catch(e){}
  setTimeout(()=>{ GRID && GRID.updateDimensions(); DRAWER && DRAWER.repaint(); },50);
}
function showScreen(key){
  renderScreen(key);
  TREE && TREE.selectItem(key);
}
